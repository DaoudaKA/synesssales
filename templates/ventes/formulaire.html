{% extends "base.html" %}
{% block titre %}{{ titre }} — SYNESS Sales{% endblock %}
{% block contenu %}
<div class="carte">
  <h1>{{ titre }}</h1>
  <p>Prospect : {{ prospect.nom }}</p>
  <form method="post">
    {% csrf_token %}
    {{ formulaire.as_p }}
    <button type="submit">{{ bouton }}</button>
  </form>
  <p><a href="{% url 'prospect' prospect.pk %}">Retour à la fiche</a></p>
</div>
{% endblock %}
