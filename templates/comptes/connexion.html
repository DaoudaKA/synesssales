{% extends "base.html" %}
{% block titre %}Connexion — SYNESS Sales{% endblock %}
{% block contenu %}
<div class="carte">
  <h1>Connexion</h1>
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}
      <p class="erreur">Adresse e-mail ou mot de passe incorrect.</p>
    {% endif %}
    <label for="id_username">Adresse e-mail</label>
    <input type="email" name="username" id="id_username" required autofocus>
    <label for="id_password">Mot de passe</label>
    <input type="password" name="password" id="id_password" required>
    <button type="submit">Se connecter</button>
  </form>
</div>
{% endblock %}
